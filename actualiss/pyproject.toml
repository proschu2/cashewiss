[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actualiss"
version = "0.1.0"
description = "Python library for integrating transactions from Swiss financial institutions with the Actual Budget app"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sanzio", email = "github@sanziomonti.xyz" }
]
dependencies = [
    "polars[excel]>=1.26.0",
    "pydantic>=2.10.6",
    "python-dateutil>=2.9.0.post0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "charset-normalizer>=3.4.1",
    "actualpy>=0.1.0",
]


[project.scripts]
actualiss = "actualiss.cli:main"

[project.optional-dependencies]
gui = [
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0"
]
dev = [
    "pytest>=7.4.4",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["actualiss"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
multi_line_output = 3

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.36.0",
    "pre-commit>=4.2.0",
]